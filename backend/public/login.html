<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar · Centro de Despacho Logístico</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            font-family: system-ui, Arial, sans-serif;
            color: #1e293b;
            padding: 20px
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 34px;
            width: min(440px, 100%);
            box-shadow: 0 24px 65px #17325825
        }

        h1 {
            font-size: 27px;
            margin: 8px 0
        }

        .sub {
            color: #64748b;
            margin: 0 0 26px
        }

        .symbol {
            font-size: 42px
        }

        .label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font: inherit
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            padding: 14px;
            font: inherit;
            font-weight: 700;
            margin-top: 23px;
            cursor: pointer
        }

        button:disabled {
            opacity: .5
        }

        .demo {
            margin-top: 26px;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
            color: #475569;
            font-size: 13px;
            line-height: 1.8
        }

        .error {
            color: #b91c1c;
            min-height: 20px
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="symbol"></div>
        <h1>Despacho Logístico</h1>
        <p class="sub">Inicia sesión para acceder al sistema</p>
        <form id="loginForm"><label class="label" for="username">Usuario</label><input id="username"
                autocomplete="username" required placeholder="admin">
            <label class="label" for="password">Contraseña</label><input id="password" type="password"
                autocomplete="current-password" required placeholder="Contraseña">
            <button type="submit">Ingresar</button>
            <p class="error" id="error" role="alert"></p>
        </form>
        <div class="demo"><b>Usuarios de demostración</b>
            <div>Administrador: <code>admin / admin123</code></div>
            <div>Cliente: <code>juan / 1234</code></div>
            <div>Chofer: <code>carlos / 1234</code></div>
            <small>Elaborado por: Miguel Sangucho, Naomi Obando, Alexis Suqquillo</small>
        </div>
    </main>
    <script src="/login.js"></script>
</body>

</html>
